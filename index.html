<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Harcourt Kanban</title>
  <meta name="description" content="Our shared board for house jobs">
  <meta name="theme-color" content="#2f6b4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Harcourt">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <h1>Harcourt</h1>
    </div>
    <div class="topbar-right">
      <span id="sync" class="sync" title="Sync status">●</span>
      <button id="menuBtn" class="icon-btn" aria-label="Menu">⋯</button>
    </div>
  </header>

  <div id="demoBanner" class="banner" hidden>
    Demo mode: cards are saved on this device only. See the README to switch on sharing.
  </div>

  <!-- Sign in -->
  <section id="login" class="login" hidden>
    <h2>Sign in</h2>
    <form id="loginForm">
      <label>Email <input type="email" id="loginEmail" autocomplete="username" required></label>
      <label>Password <input type="password" id="loginPassword" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Sign in</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </section>

  <!-- Board -->
  <main id="app" hidden>
    <button id="roomBtn" class="room-btn" aria-haspopup="dialog">
      <span class="room-label">Board</span>
      <span id="roomName">All rooms</span>
      <span aria-hidden="true">▾</span>
    </button>
    <div class="filters" role="group" aria-label="Filter by person" id="filters"></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="board" id="board"></div>
  </main>

  <button id="addBtn" class="fab" aria-label="Add a job" hidden>+</button>

  <!-- Card editor -->
  <dialog id="editor">
    <form id="editForm" method="dialog">
      <h2 id="editTitle">New job</h2>
      <label>What needs doing?
        <input id="fTitle" required maxlength="120" placeholder="e.g. Bleed the radiators">
      </label>
      <label>Notes
        <textarea id="fNotes" rows="3" placeholder="Optional details"></textarea>
      </label>
      <div class="row">
        <label>Who
          <select id="fAssignee"></select>
        </label>
        <label>Type
          <select id="fCategory"></select>
        </label>
      </div>
      <div class="row">
        <label>Due
          <input type="date" id="fDue">
        </label>
        <label>Repeats
          <select id="fRepeat">
            <option value="">Never</option>
            <option value="weekly">Weekly</option>
            <option value="fortnightly">Fortnightly</option>
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Room
          <select id="fRoom"></select>
        </label>
        <label>Column
          <select id="fStatus"></select>
        </label>
      </div>
      <div class="actions">
        <button type="button" id="deleteBtn" class="danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Room picker -->
  <dialog id="rooms">
    <div class="rooms">
      <h2>Choose a board</h2>
      <div id="roomGrid" class="room-grid"></div>
      <button id="closeRoomsBtn">Close</button>
    </div>
  </dialog>

  <!-- Menu -->
  <dialog id="menu">
    <div class="menu">
      <button id="clearDoneBtn">Clear finished jobs</button>
      <button id="signOutBtn">Sign out</button>
      <button id="closeMenuBtn">Close</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
